<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消費税シミュレーション｜本則課税 vs 簡易課税</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; background: #f5f7fa; color: #333; font-size: 14px; }
  header { background: #1a3a5c; color: #fff; padding: 20px 24px; }
  header h1 { font-size: 1.35rem; font-weight: 700; }
  header p { font-size: 0.82rem; opacity: 0.8; margin-top: 5px; }
  .container { max-width: 960px; margin: 24px auto; padding: 0 16px 40px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 1rem; color: #1a3a5c; border-bottom: 2px solid #1a3a5c; padding-bottom: 8px; margin-bottom: 18px; font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 0.82rem; color: #555; font-weight: 600; }
  .input-group input, .input-group select { padding: 9px 11px; border: 1.5px solid #d0d5dd; border-radius: 7px; font-size: 0.95rem; font-family: inherit; }
  .input-group input:focus, .input-group select:focus { outline: none; border-color: #1a3a5c; }
  .info-box { background: #eef4ff; border-left: 4px solid #1a3a5c; padding: 11px 14px; border-radius: 0 7px 7px 0; margin-bottom: 16px; font-size: 0.82rem; line-height: 1.6; color: #444; }
  .warn-box { background: #fffbeb; border-left: 4px solid #d97706; padding: 11px 14px; border-radius: 0 7px 7px 0; margin-bottom: 16px; font-size: 0.82rem; line-height: 1.6; color: #444; }
  .btn-calc { width: 100%; padding: 13px; background: #1a3a5c; color: #fff; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
  .btn-calc:hover { background: #2a5a8c; }
  .section-divider { margin: 20px 0 16px; border: none; border-top: 1px solid #e2e8f0; }

  /* 結果 */
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .result-box { border-radius: 10px; padding: 20px; }
  .result-box.honsoku { background: #eff6ff; border: 2px solid #3b82f6; }
  .result-box.kannikouzei { background: #f0fdf4; border: 2px solid #22c55e; }
  .result-box.winner { border-width: 3px; }
  .result-box h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; }
  .result-box h3.honsoku { color: #1d4ed8; }
  .result-box h3.kannikouzei { color: #15803d; }
  .result-amount { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
  .result-amount.honsoku { color: #1d4ed8; }
  .result-amount.kannikouzei { color: #15803d; }
  .result-detail { font-size: 0.78rem; color: #555; margin-top: 10px; line-height: 1.7; }
  .badge-win { display: inline-block; background: #166534; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; margin-left: 6px; }
  .diff-box { background: #fef9c3; border: 1px solid #facc15; border-radius: 8px; padding: 14px 18px; text-align: center; margin-bottom: 16px; }
  .diff-box p { font-size: 0.9rem; color: #713f12; }
  .diff-box strong { font-size: 1.15rem; }

  table.dtable { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.dtable th { background: #1a3a5c; color: #fff; padding: 8px 12px; text-align: left; }
  table.dtable td { padding: 7px 12px; border-bottom: 1px solid #e2e8f0; }
  table.dtable tr:last-child td { border-bottom: none; }
  .note { font-size: 0.75rem; color: #888; margin-top: 14px; line-height: 1.7; }
  .tab-bar { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 2px solid #1a3a5c; }
  .tab { padding: 8px 18px; cursor: pointer; font-size: 0.88rem; font-weight: 600; color: #555; border-radius: 6px 6px 0 0; background: #f0f4f8; }
  .tab.active { background: #1a3a5c; color: #fff; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  @media (max-width: 600px) {
    .grid2, .grid3, .result-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>消費税シミュレーション</h1>
  <p>本則課税と簡易課税の納税額を比較し、有利な課税方式を判定します</p>
</header>

<div class="container">

  <!-- 共通情報 -->
  <div class="card">
    <h2>基本情報</h2>
    <div class="grid2">
      <div class="input-group">
        <label>課税期間の課税売上高（税抜）</label>
        <input type="number" id="uriage" value="30000000" step="100000" min="0">
      </div>
      <div class="input-group">
        <label>うち軽減税率（8%）分の課税売上高（税抜）</label>
        <input type="number" id="uriage8" value="0" step="100000" min="0">
      </div>
    </div>
    <div class="info-box" style="margin-top:14px">
      課税売上高が5,000万円以下の事業者は簡易課税制度が選択できます（前々事業年度基準）。<br>
      インボイス登録事業者で課税売上高が1,000万円以下の場合は「2割特例」も利用可能です（2026年9月30日まで）。
    </div>
  </div>

  <!-- タブ：本則課税 -->
  <div class="card">
    <h2>本則課税の入力</h2>
    <div class="grid3">
      <div class="input-group">
        <label>課税仕入れ合計（税込）</label>
        <input type="number" id="shiire" value="20000000" step="100000" min="0">
      </div>
      <div class="input-group">
        <label>うち軽減税率（8%）分（税込）</label>
        <input type="number" id="shiire8" value="0" step="100000" min="0">
      </div>
      <div class="input-group">
        <label>課税売上割合</label>
        <select id="uriageWari">
          <option value="1.0" selected>95%以上（全額控除）</option>
          <option value="0.9">90%以上95%未満</option>
          <option value="0.8">80%以上90%未満</option>
          <option value="0.7">70%以上80%未満</option>
          <option value="0.6">60%以上70%未満</option>
          <option value="0.5">50%以上60%未満</option>
          <option value="0.4">40%以上50%未満</option>
          <option value="custom">手入力</option>
        </select>
      </div>
    </div>
    <div id="customWariRow" style="display:none;margin-top:12px">
      <div class="input-group" style="max-width:200px">
        <label>課税売上割合（手入力 %）</label>
        <input type="number" id="customWari" value="80" min="0" max="100" step="1">
      </div>
    </div>
  </div>

  <!-- 簡易課税 -->
  <div class="card">
    <h2>簡易課税の入力</h2>
    <div class="grid2">
      <div class="input-group">
        <label>事業区分（みなし仕入率）</label>
        <select id="jigyoKubun">
          <option value="0.9">第1種（卸売業）90%</option>
          <option value="0.8">第2種（小売業・農業等）80%</option>
          <option value="0.7">第3種（製造業・建設業・農業等）70%</option>
          <option value="0.6" selected>第4種（飲食業・その他）60%</option>
          <option value="0.5">第5種（サービス業・運輸・金融等）50%</option>
          <option value="0.4">第6種（不動産業）40%</option>
        </select>
      </div>
      <div class="input-group">
        <label>インボイス登録状況</label>
        <select id="invoice">
          <option value="no">未登録（免税事業者は対象外）</option>
          <option value="yes" selected>登録済（適格請求書発行事業者）</option>
        </select>
      </div>
    </div>
    <div class="warn-box" style="margin-top:14px">
      2割特例：インボイス登録を機に課税事業者になった場合のみ適用可（2023/10〜2026/9）。<br>
      納税額 ＝ 課税売上げ消費税額 × 20%（みなし仕入率80%相当）。
    </div>
    <button class="btn-calc" onclick="calculate()" style="margin-top:16px">計算する</button>
  </div>

  <!-- 結果 -->
  <div class="card" id="resultCard" style="display:none">
    <h2>計算結果</h2>
    <div class="diff-box" id="diffBox"></div>
    <div class="result-grid" id="resultGrid"></div>
    <hr class="section-divider">
    <h3 style="font-size:0.9rem;color:#1a3a5c;margin-bottom:12px;font-weight:700">計算内訳</h3>
    <table class="dtable" id="detailTable"></table>
    <p class="note" id="resultNote"></p>
  </div>

</div>

<script>
document.getElementById('uriageWari').addEventListener('change', function() {
  document.getElementById('customWariRow').style.display = this.value === 'custom' ? 'block' : 'none';
});

function getWari() {
  const sel = document.getElementById('uriageWari').value;
  if (sel === 'custom') return (parseFloat(document.getElementById('customWari').value) || 80) / 100;
  return parseFloat(sel);
}

function fmt(n) { return Math.round(n).toLocaleString('ja-JP') + '円'; }

function calculate() {
  const uriage   = parseFloat(document.getElementById('uriage').value)   || 0; // 税抜10%分
  const uriage8  = parseFloat(document.getElementById('uriage8').value)  || 0; // 税抜8%分
  const uriage10 = uriage - uriage8; // 標準税率分
  const shiire   = parseFloat(document.getElementById('shiire').value)   || 0; // 税込10%分
  const shiire8  = parseFloat(document.getElementById('shiire8').value)  || 0; // 税込8%分
  const shiire10 = shiire - shiire8;
  const wari     = getWari();
  const kubun    = parseFloat(document.getElementById('jigyoKubun').value);
  const invoiced = document.getElementById('invoice').value === 'yes';

  // ── 本則課税 ──────────────────────────────────────────────
  // 売上消費税
  const uriageZei10 = uriage10 * 0.10;
  const uriageZei8  = uriage8  * 0.08;
  const uriageZeiTotal = uriageZei10 + uriageZei8;

  // 仕入税額控除（課税売上割合で按分）
  const shiireZei10 = shiire10 * (10/110);
  const shiireZei8  = shiire8  * (8/108);
  const shiireZeiTotal = (shiireZei10 + shiireZei8) * wari;

  const honsokuZei = Math.max(0, uriageZeiTotal - shiireZeiTotal);

  // ── 簡易課税 ──────────────────────────────────────────────
  const kaniZei = uriageZeiTotal * (1 - kubun);

  // ── 2割特例 ───────────────────────────────────────────────
  const niWariZei = uriageZeiTotal * 0.20;

  // 差額
  const diff = honsokuZei - kaniZei;
  const winner = diff > 0 ? '簡易課税' : diff < 0 ? '本則課税' : '同額';

  // 結果表示
  const diffBox = document.getElementById('diffBox');
  if (diff === 0) {
    diffBox.innerHTML = '<p>本則課税と簡易課税の納税額は<strong>同額</strong>です</p>';
  } else {
    const winStr  = diff > 0 ? '簡易課税' : '本則課税';
    const loseStr = diff > 0 ? '本則課税' : '簡易課税';
    const saveAmt = Math.abs(diff);
    diffBox.innerHTML = `<p><strong>${winStr}</strong>の方が <strong>${fmt(saveAmt)}</strong> 節税になります（${loseStr}との比較）</p>`;
  }

  document.getElementById('resultGrid').innerHTML = `
    <div class="result-box honsoku${winner === '本則課税' ? ' winner' : ''}">
      <h3 class="honsoku">本則課税${winner === '本則課税' ? '<span class="badge-win">有利</span>' : ''}</h3>
      <div class="result-amount honsoku">${fmt(honsokuZei)}</div>
      <div class="result-detail">
        売上消費税：${fmt(uriageZeiTotal)}<br>
        仕入税額控除（按分後）：▲${fmt(shiireZeiTotal)}<br>
        課税売上割合：${Math.round(wari*100)}%
      </div>
    </div>
    <div class="result-box kannikouzei${winner === '簡易課税' ? ' winner' : ''}">
      <h3 class="kannikouzei">簡易課税${winner === '簡易課税' ? '<span class="badge-win">有利</span>' : ''}${invoiced ? '<br><span style="font-size:0.75rem;font-weight:400">※ 2割特例：' + fmt(niWariZei) + '</span>' : ''}</h3>
      <div class="result-amount kannikouzei">${fmt(kaniZei)}</div>
      <div class="result-detail">
        売上消費税：${fmt(uriageZeiTotal)}<br>
        みなし控除（${Math.round(kubun*100)}%）：▲${fmt(uriageZeiTotal * kubun)}<br>
        ${invoiced ? '2割特例適用時：' + fmt(niWariZei) : ''}
      </div>
    </div>`;

  document.getElementById('detailTable').innerHTML = `
    <tr><th>項目</th><th>本則課税</th><th>簡易課税</th></tr>
    <tr><td>標準税率（10%）売上消費税</td><td>${fmt(uriageZei10)}</td><td>${fmt(uriageZei10)}</td></tr>
    <tr><td>軽減税率（8%）売上消費税</td><td>${fmt(uriageZei8)}</td><td>${fmt(uriageZei8)}</td></tr>
    <tr><td>売上消費税 合計</td><td><strong>${fmt(uriageZeiTotal)}</strong></td><td><strong>${fmt(uriageZeiTotal)}</strong></td></tr>
    <tr><td>標準税率 仕入税額</td><td>▲${fmt(shiireZei10 * wari)}</td><td rowspan="3" style="vertical-align:middle;text-align:center">みなし仕入率<br>（${Math.round(kubun*100)}%）<br>▲${fmt(uriageZeiTotal * kubun)}</td></tr>
    <tr><td>軽減税率 仕入税額</td><td>▲${fmt(shiireZei8 * wari)}</td></tr>
    <tr><td>課税売上割合按分</td><td>×${Math.round(wari*100)}%</td></tr>
    <tr><td><strong>納税額</strong></td><td><strong>${fmt(honsokuZei)}</strong></td><td><strong>${fmt(kaniZei)}</strong></td></tr>
    ${invoiced ? `<tr><td>2割特例（参考）</td><td>―</td><td>${fmt(niWariZei)}</td></tr>` : ''}
  `;

  document.getElementById('resultNote').innerHTML =
    '※ 地方消費税（2.2%・1.76%）は国税分（7.8%・6.24%）に含めず、別途国税額×22/78として発生します。ここでは消費税+地方消費税の合計税率（10%・8%）で計算しています。<br>' +
    '※ 仕入税額控除は課税売上割合が95%未満の場合に按分が必要です（個別対応方式・一括比例配分方式）。ここでは一括比例配分方式で計算しています。<br>' +
    '※ 2割特例は2023年10月1日〜2026年9月30日の課税期間が対象です。事前届出不要で毎年選択可能。<br>' +
    '※ 実際の納税額は税理士にご確認ください。';

  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
}

window.addEventListener('DOMContentLoaded', calculate);
</script>
<script src="shared.js"></script>
</body>
</html>
